[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recipe_images"
version = "0.1.0"
description = "Human-reviewed Pixabay recipe image selection and processing CLI"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "Pillow>=10", "typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
hash = ["blurhash-python>=1.2"]

[project.scripts]
recipe_images = "recipe_images.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008", "TRY004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
