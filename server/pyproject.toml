[project]
name = "my-little-chef-server"
version = "0.1.0"
description = "Local FastAPI backend for My Little Chef: ingredient recognition and recipe recommendation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "google-genai>=2.29.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
# db/ is the recipe importer owned by the data workstream; lint it there, not here.
extend-exclude = ["db"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
