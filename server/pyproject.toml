[project]
name = "my-little-chef-server"
version = "0.1.0"
description = "FastAPI backend for My Little Chef: ingredient recognition and dish suggestions"
requires-python = ">=3.12"
dependencies = [
    "cachetools>=5.5",
    "fastapi>=0.143.0",
    "google-genai>=2.29.0",
    "httpx>=0.28.1",
    "openai>=2.54,<3",
    "opentelemetry-instrumentation-fastapi>=0.66b0,<0.67",
    "opentelemetry-sdk>=1.45,<1.46",
    "pydantic-settings>=2.10",
    "python-multipart>=0.0.32",
    "tenacity>=9.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "python-dotenv>=1.0,<2",
    "ruff>=0.17.0",
    "types-cachetools>=7.0.0.20260713",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "..", "../research"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"
# Only the original contributor tests are left as written: CI pins their content by hash
# (tests/references/contributor-tests.json, scripts/check_integration_policy.py).
extend-exclude = [
    "tests/experiments/filtering/test_metrics_exclusions.py",
    "tests/experiments/revision/test_adapters.py",
    "tests/experiments/revision/test_core.py",
    "tests/experiments/revision/test_loader.py",
    "tests/experiments/revision/test_runner.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
# The service code only; research and tests are checked by ruff and pytest.
files = ["app"]
ignore_missing_imports = true
