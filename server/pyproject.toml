[project]
name = "my-little-chef-server"
version = "0.1.0"
description = "Local FastAPI backend for My Little Chef: ingredient recognition and recipe recommendation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "google-genai>=2.29.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2,<4",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.48",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "python-dotenv>=1.0,<2",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "..", "../research"]

[tool.coverage.run]
source = ["app", "recipe_filtering", "recipe_revision"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"
# Preserve contributor importer/experiment formatting; their original tests run in pytest.
extend-exclude = ["db", "tests/experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
