# Public-IP development endpoint. Add a domain and TLS before production distribution.
# No authentication in this demo: model calls cost money (see README). Only the usage upload is
# rate-limited: the app sends a batch of at most 20 events when it goes to the background or the
# batch fills, so one phone rarely sends more than a few per minute. 60 per minute per address,
# with a burst of 60, leaves room for about 20 testers behind one campus address and stops a loop
# from filling the usage file (which also has its own size limit, ADR 007).
limit_req_zone $binary_remote_addr zone=telemetry:1m rate=60r/m;
server {
    listen 80;
    server_tokens off;
    client_max_body_size 16m;
    location = /telemetry/events {
        limit_req zone=telemetry burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        proxy_connect_timeout 5s;
        proxy_set_header Host $host;
    }
    location / {
        proxy_pass http://api:8000;
        proxy_read_timeout 210s;
        proxy_connect_timeout 5s;
        proxy_set_header Host $host;
    }
}
