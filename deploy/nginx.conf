# Public-IP development endpoint. Add a domain and TLS before production distribution.
limit_req_zone $binary_remote_addr zone=ai:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=clients:10m;
server {
    listen 80;
    server_tokens off;
    client_max_body_size 16m;
    limit_conn clients 4;
    limit_req_status 429;
    location ~ ^/(analyze|recipes/recommendations)$ {
        limit_req zone=ai burst=3 nodelay;
        proxy_pass http://api:8000;
        proxy_read_timeout 210s;
        proxy_connect_timeout 5s;
        proxy_set_header Host $host;
    }
    location / {
        proxy_pass http://api:8000;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_set_header Host $host;
    }
}
