name: mylittlechef
x-api: &api
  image: ${APP_IMAGE:-mylittlechef:local}
  build: .
  env_file: ${RUNTIME_ENV:-/opt/mylittlechef/config/runtime.env}
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  networks: [backend]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}
services:
  api:
    <<: *api
    environment:
      DISH_VIDEO_CACHE: /data/dish-videos.json
    volumes:
      - ${DISH_DATA_DIR:-/opt/mylittlechef/data/dish-videos}:/data:ro
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=10)"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
  nginx:
    image: nginx:1.28-alpine
    ports: ["80:80"]
    volumes: ["./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [api]
    restart: unless-stopped
    networks: [backend]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  dish-cache:
    # Fills the dish video cache (deploy/dish-cache.sh). Not part of the running stack.
    image: ${APP_IMAGE:-mylittlechef:local}
    build: .
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    profiles: [tools]
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    environment:
      DISH_VIDEO_CACHE: /data/dish-videos.json
      YOUTUBE_API_KEY:
    volumes:
      - ${DISH_DATA_DIR:-/opt/mylittlechef/data/dish-videos}:/data
    entrypoint: [python, -m, app.dishes.prefetch]
networks:
  backend:
