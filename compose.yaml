name: mylittlechef
x-api: &api
  image: ${APP_IMAGE:-mylittlechef:local}
  build: .
  env_file: ${RUNTIME_ENV:-/opt/mylittlechef/config/runtime.env}
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  networks: [backend]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: chef
      POSTGRES_USER: chef
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [postgres:/var/lib/postgresql/data]
    restart: unless-stopped
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U chef -d chef"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  api:
    <<: *api
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=10)"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
  nginx:
    image: nginx:1.28-alpine
    ports: ["80:80"]
    volumes: ["./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [api]
    restart: unless-stopped
    networks: [backend]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  importer:
    <<: *api
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    profiles: [tools]
    volumes: ["${DATASET_DIR:-/opt/mylittlechef/datasets}:/datasets:ro"]
    entrypoint: [python, -m, db.postgres]
    depends_on:
      postgres: {condition: service_healthy}
networks:
  backend:
volumes:
  postgres:
secrets:
  db_password:
    file: ${DB_PASSWORD_FILE:-/opt/mylittlechef/config/db_password}
