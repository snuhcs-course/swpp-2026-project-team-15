name: mylittlechef
x-api: &api
  image: ${APP_IMAGE:-mylittlechef:local}
  build: .
  env_file: ${RUNTIME_ENV:-./deploy/runtime.env}
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  networks: [backend]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}
services:
  api:
    <<: *api
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=10)"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
  nginx:
    image: nginx:1.28-alpine
    ports: ["${HTTP_PORT:-80}:80"]
    volumes: ["./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [api]
    restart: unless-stopped
    networks: [backend]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
networks:
  backend:
