[project]
name = "recipe-tools"
version = "0.1.0"
description = "Offline recipe data preparation tools"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "Pillow>=10", "typer>=0.12", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
hash = ["blurhash-python>=1.2"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008", "TRY004"]

[tool.pytest.ini_options]
testpaths = ["crawlers/pixabay/tests"]
pythonpath = ["crawlers/pixabay/src"]
