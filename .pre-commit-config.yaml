repos:
  - repo: local
    hooks:
      - id: python-lint
        name: Python runtime lint
        entry: uv run --directory server --locked ruff check .
        language: system
        pass_filenames: false
        files: ^server/.*\.py$
      - id: python-format
        name: Python runtime format
        entry: uv run --directory server --locked ruff format --check .
        language: system
        pass_filenames: false
        files: ^server/.*\.py$
      - id: integration-policy
        name: Preserve acceptance references and existing tests
        entry: python3 scripts/check_integration_policy.py
        language: system
        pass_filenames: false
      - id: whitespace
        name: Git whitespace check
        entry: git diff --cached --check
        language: system
        pass_filenames: false
