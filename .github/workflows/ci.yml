# AI-generated with Claude Code (Opus 5.5), 2026-10-14; reviewed by Jaehyuk Choi.
# Fast checks on every pull request and on main (course Week 7-1, p.39).
# Device tests (connectedDebugAndroidTest) need an emulator and are run locally for now.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_PASSWORD: localtest
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:localtest@localhost:5432/postgres
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check . ../scripts ../research/evaluation
      - run: uv run ruff format --check . ../scripts ../research/evaluation
      - run: python ../scripts/check_integration_policy.py
      - run: uv run pytest --cov --cov-report=term-missing --cov-report=xml --cov-report=html --junitxml=test-results.xml
      - run: python ../scripts/package_server.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-reports
          path: |
            server/test-results.xml
            server/coverage.xml
            server/htmlcov
            dist/server.tar.gz

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: sh ./gradlew lintDebug testDebugUnitTest createDebugUnitTestCoverageReport assembleDebug assembleCloudTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            android/app/build/reports
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/cloudTest/*.apk

  arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --project server --locked
      - run: uv run --project server pytest server/tests -q
      - run: docker build -t mylittlechef:ci .
      - run: docker run --rm mylittlechef:ci python -c "import app.main, psycopg; print('ARM runtime imports OK')"
